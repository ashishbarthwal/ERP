name: Change-aware ERP tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all reviewed ERP contracts
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: erp-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-test-password
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ERP_TEST_DATABASE_URL: postgresql://erp:erp-test-password@localhost:5432/erp_test?schema=public
      ERP_TEST_DIRECT_URL: postgresql://erp:erp-test-password@localhost:5432/erp_test?schema=public
      AUTH_LOGIN_ATTEMPT_LIMIT: '250'
      AUTH_SIGNUP_ATTEMPT_LIMIT: '250'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: erp
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Analyze changes and run generated contracts
        # Reviewed PostgreSQL contract runner pinned to a published framework commit.
        uses: ashishbarthwal/ai-self-healing-test-automation-framework@8e8ea45549a3f8c6f976c8085e1cc3e8033a3af3
        with:
          erp-path: ${{ github.workspace }}/erp
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          full: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
