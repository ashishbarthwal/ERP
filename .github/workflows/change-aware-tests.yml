name: Change-aware ERP tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all reviewed ERP contracts
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: erp-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-test-password
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ERP_TEST_DATABASE_URL: postgresql://erp:erp-test-password@localhost:5432/erp_test?schema=public
      ERP_TEST_DIRECT_URL: postgresql://erp:erp-test-password@localhost:5432/erp_test?schema=public
      AUTH_LOGIN_ATTEMPT_LIMIT: '250'
      AUTH_SIGNUP_ATTEMPT_LIMIT: '250'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: erp
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Analyze changes and run generated contracts
        # Reviewed PostgreSQL contract runner pinned to a CI-verified framework commit.
        uses: ashishbarthwal/ai-self-healing-test-automation-framework@e23d47546b08da31922f207e2f9c25ccf06672a1
        with:
          erp-path: ${{ github.workspace }}/erp
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          full: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
      - name: Verify PostgreSQL backup and restore
        run: npm run test:ops
        working-directory: ${{ github.workspace }}/erp
      - name: Run PostgreSQL backup and restore smoke
        run: npm run db:backup-restore:smoke
        working-directory: ${{ github.workspace }}/erp
